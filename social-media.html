<figure><img src="github/1.png" alt="Social media design 1" loading="lazy"></figure>

  </section>

  <!-- Click-to-enlarge viewer (uses your existing .lightbox style) -->
  <div class="lightbox" id="lightbox"><img alt="Enlarged design"></div>

  <script>
    var lb = document.getElementById('lightbox');
    var lbImg = lb.querySelector('img');
    document.querySelectorAll('.pgal img').forEach(function (img) {
      img.addEventListener('click', function () {
        lbImg.src = img.src;
        lb.classList.add('show');
      });
    });
    lb.addEventListener('click', function () { lb.classList.remove('show'); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') lb.classList.remove('show');
    });
  </script>

  <footer class="footer"><div class="container">&#169; 2026 Ania Socials. All rights reserved.</div></footer>
<div class="lightbox" id="lightbox"><img alt="Project preview" id="lbImg"></div>
